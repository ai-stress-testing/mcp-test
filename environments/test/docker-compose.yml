# Self-hosted Supabase — TEST environment (PRD sprint-7-26-19-26 §7).
#
# Scope: the minimum service set the pricing/checkout app actually talks to
# — Postgres, Auth (gotrue), REST (PostgREST), a gateway (Kong) in front of
# them, and Studio for local admin/inspection. Realtime, Storage, imgproxy,
# Edge Functions, and Supavisor are upstream Supabase services this app does
# not use yet; they are intentionally omitted, not forgotten — see
# environments/README.md "Why this subset" for the seam to add one back.
#
# Parity contract: this file provisions the *database platform* plus the
# `app` service (ADR-0002 Decision 3) built from pipeline/app/Dockerfile.
# The app image itself is promoted unmodified test -> prod (no compose
# file in prod at all — see environments/README.md and ADR-0002
# Decision 4); only its injected env differs. No app source, business
# logic, or DB schema lives in this repo path — those are backend-dev's
# ticket (see pipeline/app/ and ./volumes/db/init/README.md).
#
# All images pinned to an explicit version — no `:latest` anywhere.

name: mcp-test-supabase-test

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    ports:
      # Local-only debug access (psql). Not exposed by the prod topology.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Seam for backend-dev: drop schema/migration SQL here (applied by
      # the upstream image's entrypoint on first boot). Left empty by
      # design — this agent does not own the schema. See README in the
      # mounted folder.
      - ./volumes/db/init:/docker-entrypoint-initdb.d:ro
    logging: *default-logging

  auth:
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-postgres}
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_DISABLE_SIGNUP: "false"
    logging: *default-logging

  rest:
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    logging: *default-logging

  meta:
    image: supabase/postgres-meta:v0.96.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    logging: *default-logging

  studio:
    image: supabase/studio:2026.07.07-sha-a6a04f2
    restart: unless-stopped
    depends_on:
      - meta
      - rest
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in .env}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in .env}
    ports:
      # Admin UI, local-only. Not part of the prod topology.
      - "${STUDIO_PORT:-3001}:3000"
    logging: *default-logging

  kong:
    image: kong/kong:3.9.1
    restart: unless-stopped
    depends_on:
      - auth
      - rest
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in .env}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in .env}
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro
    ports:
      # This is the single front door the app talks to
      # (SUPABASE_URL=http://localhost:${KONG_HTTP_PORT}).
      - "${KONG_HTTP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # ---------------------------------------------------------------------
  # app — the pricing/checkout request path (ADR-0002 Decision 3:
  # docs/sprint-7-26-19-26/adr/ADR-0002-supabase-store-environments.md).
  # This is the only service here that isn't part of the Supabase
  # platform: a small FastAPI service talking to Postgres via the DAO
  # (no Supabase client libs — Decision 1's guardrail). Built from
  # pipeline/app/Dockerfile; app source, DB schema, and pipeline/web/ are
  # backend-dev's / other tickets' seams, not this agent's.
  #
  # IMAGE PARITY: this image is built once and promoted test -> prod
  # unmodified (environments/README.md, ADR-0002 Decision 4). Prod runs
  # no compose file at all — the exact same image digest built here is
  # simply pointed at environments/prod/.env's values (managed Postgres
  # DATABASE_URL, live-mode Stripe keys) by the deploy platform. Only the
  # injected env differs; nothing below bakes in a secret.
  # ---------------------------------------------------------------------
  app:
    build:
      # Context is pipeline/ (not pipeline/app/) so the image includes
      # pricing_engine.py and web/ that the app imports/serves at runtime.
      context: ../../pipeline
      dockerfile: app/Dockerfile
    image: mcp-test-app:test
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # DAO speaks plain Postgres (ADR-0002 Decision 1) — this points at
      # the `db` service in-network for test; prod's DATABASE_URL points
      # at the managed project instead. Same var name, env-supplied both
      # places, never baked into the image.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?set STRIPE_SECRET_KEY in .env}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?set STRIPE_WEBHOOK_SECRET in .env}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      APP_ENV: ${APP_ENV:-test}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      PRICE_FLOOR: ${PRICE_FLOOR:-}
      PRICE_CEIL: ${PRICE_CEIL:-}
    ports:
      # App port, local-only in test; prod exposes this behind whatever
      # the deploy platform fronts it with (not this file's concern).
      # Default host port 8001, NOT 8000 — kong already claims host 8000
      # (${KONG_HTTP_PORT:-8000}); the container's own port stays 8000
      # either way (the app's fixed contract), only the host mapping
      # moves to avoid the collision.
      - "${APP_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging

volumes:
  db-data:
    name: mcp-test-supabase-test-db-data
