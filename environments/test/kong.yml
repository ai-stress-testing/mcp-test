# Kong declarative config for the self-hosted TEST Supabase gateway.
#
# Trimmed from upstream Supabase's kong.yml to the two backends this app
# actually calls (auth, rest). Add storage-v1 / realtime-v1 / functions-v1
# blocks here, mirroring the pattern below, if/when those services are
# added to docker-compose.yml — see environments/README.md "Why this
# subset".
_format_version: "2.1"
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      # Kong's declarative-config loader substitutes bare $VAR references
      # (not ${VAR}) from the container's environment at load time.
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: auth-v1-open
    _comment: "Auth: /auth/v1/verify* -> http://auth:9999/verify* (no key required)"
    url: http://auth:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors

  - name: auth-v1
    _comment: "Auth: /auth/v1/* -> http://auth:9999/*"
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true

  - name: rest-v1
    _comment: "PostgREST: /rest/v1/* -> http://rest:3000/*"
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
